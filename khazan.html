<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styl.css">
  <title>خازن</title>
  <link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="product-detail">

  <!-- تصویر -->
  <div class="product-image">
    <img id="mainImage" src="/images/khazan1.jpg">
    <img id="mainImage" src="/images/khazan2.jpg">
  </div>

  <!-- اطلاعات -->
  <div class="product-content">
    <h1>خازن الکترونیکی</h1>

    <p class="product-price">10,000 تومان</p>
    
    <div class="product-meta">

  <!-- موجودی -->
  <div class="stock">
    موجودی:
    <span id="stockCount">5</span> عدد
  </div>

  <!-- رنگ‌ها -->
 
</div>

    <div class="product-actions">
      <button class="add-btn"
        onclick="addToCart('خازن', 100000)">
        افزودن به سبد خرید
      </button>

      <button class="wishlist-btn"
        onclick="toggleWishlist(this)">
        ❤️
      </button>
    </div>

    <div class="product-desc">
      <h3>توضیحات محصول</h3>
      <p>
        خازن الکترونیکی وارداتی از چین و ژاپن 
        مخصوص برد های صنعتی
      </p>
    </div>

    <div class="product-specs">
      <h3>مشخصات فنی</h3>
      <ul>
        <li>اندازه:10میلی متر</li>
        <li>پایه بلند</li>
        <li>جنس: پلاستیک</li>
        <li>دارای پارانتی 7روز تعویز</li>
      </ul>
    </div>
  </div>

</div>

<script src="cart.js"></script>
</body>
</html>
