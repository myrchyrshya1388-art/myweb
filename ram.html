<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styl.css">
  <title>رم کامپیوتر</title>
  <link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="product-detail">

  <!-- تصویر -->
  <div class="product-image">
    <img id="mainImage" src="/images/ram.jpg">
  </div>

  <!-- اطلاعات -->
  <div class="product-content">
    <h1>رم کامپیوتر</h1>

    <p class="product-price">1,800,000تومان</p>
    
    <div class="product-meta">

  <!-- موجودی -->
  <div class="stock">
    موجودی:
    <span id="stockCount">5</span> عدد
  </div>

 

    <div class="product-actions">
      <button class="add-btn"
        onclick="addToCart('رم کامپیوتر', 18000000)">
        افزودن به سبد خرید
      </button>

      <button class="wishlist-btn"
        onclick="toggleWishlist(this)">
        ❤️
      </button>
    </div>

    <div class="product-desc">
      <h3>توضیحات محصول</h3>
      <p>
        رم کامپیوتر مدل های موجود :ddr3,ddr2,ddr4
        قیمت پایه از 1.800.000
      </p>
    </div>

    <div class="product-specs">
      <h3>مشخصات فنی</h3>
      <ul>
        <li>رم</li>
        <li>ساخت چین</li>
        <li>حافظه های موجود :4گیگ و 8گیگ و 16 گیگ و 32 گیگ و 12گیگ</li>
        <li>گارانتی :2ماه پس از فوروش</li>
      </ul>
    </div>
  </div>

</div>

<script src="cart.js"></script>
</body>
</html>
