<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stayl.css">
  <title>موتور آرمیچر برقی</title>
  <link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="product-detail">

  <!-- تصویر -->
  <div class="product-image">
    <img id="mainImage" src="/images/motorbarghe.jpg">
  </div>

  <!-- اطلاعات -->
  <div class="product-content">
    <h1>موتورآرمیچر برقی</h1>

    <p class="product-price">45,000,000</p>
    
    <div class="product-meta">

  <!-- موجودی -->
  <div class="stock">
    موجودی:
    <span id="stockCount">5</span> عدد
  </div>

  

</div>

    <div class="product-actions">
      <button class="add-btn"
        onclick="addToCart('موتورآرمیچر برقی', 45000000)">
        افزودن به سبد خرید
      </button>

      <button class="wishlist-btn"
        onclick="toggleWishlist(this)">
        ❤️
      </button>
    </div>

    <div class="product-desc">
      <h3>توضیحات محصول</h3>
      <p>
        موتور آرمیچر برقی ساخت کشو چین 
        استفاده در لوازم صنعتی و شرکتی 
      </p>
    </div>

    <div class="product-specs">
      <h3>مشخصات فنی</h3>
      <ul>
        <li>برقی</li>
        <li>اتومات</li>
        <li>ساخت چین</li>
        <li>گارانتی :5ماه پس از خرید</li>
      </ul>
    </div>
  </div>

</div>

<script src="cart.js"></script>
</body>
</html>
