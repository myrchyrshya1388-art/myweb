<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شبکه و اینترنت</title>
  <link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="product-detail">

  <!-- تصویر -->
  <div class="product-image">
    <img id="mainImage" src="/images/network.jpg">
  </div>

  <!-- اطلاعات -->
  <div class="product-content">
    <h1>شبکه</h1>

    <p class="product-price">توافقی</p>

    <div class="product-actions">
      <button class="add-btn"
        onclick="addToCart('شبکه')">
        افزودن به سبد خرید
      </button>

      <button class="wishlist-btn"
        onclick="toggleWishlist(this)">
        ❤️
      </button>
    </div>

    <div class="product-desc">
      <h3>توضیحات محصول</h3>
      <p>  
        خدمات شبکه و اینترنت نصب مدم  و روتر و سویچ برای شرکت ها و خانه ها و مغازه ها 
        خدمات اینترنت (ADSL)و فیبر نوری
      </p>
    </div>

    <div class="product-specs">
      <h3>مشخصات فنی</h3>
      <ul>
        <li>DNS</li>
        <li>CONFING</li>
        <li>SERVIS(ADSL)</li>
        <li>دارای گارانتی :5ماه پس از فوروش و نصب و پاسخگویی 24 ساعته در سراسر کشور</li>
      </ul>
    </div>
  </div>

</div>

<script src="cart.js"></script>
</body>
</html>
