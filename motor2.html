<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stayl.css">
  <title>موتور صنعتی </title>
  <link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="product-detail">

  <!-- تصویر -->
  <div class="product-image">
    <img id="mainImage" src="/images/motor.jpg">
  </div>

  <!-- اطلاعات -->
  <div class="product-content">
    <h1>موتور صنعتی </h1>

    <p class="product-price">21,000,000 تومان</p>
    
    <div class="product-meta">

  <!-- موجودی -->
  <div class="stock">
    موجودی:
    <span id="stockCount">5</span> عدد
  </div>

  
</div>

    <div class="product-actions">
      <button class="add-btn"
        onclick="addToCart('موتورصنعتی', 21000000)">
        افزودن به سبد خرید
      </button>

      <button class="wishlist-btn"
        onclick="toggleWishlist(this)">
        ❤️
      </button>
    </div>

    <div class="product-desc">
      <h3>توضیحات محصول</h3>
      <p>
        موتور صنعتیی ساخت چین منتاژ ایران استفاده در لوازم خانگی 
      </p>
    </div>

    <div class="product-specs">
      <h3>مشخصات فنی</h3>
      <ul>
        <li>دور موتور بالا</li>
        <li>ساخت چین</li>
        <li>استفاده خانگی</li>
        <li>گارانتی :5ماه پس از فوروش</li>
      </ul>
    </div>
  </div>

</div>

<script src="cart.js"></script>
</body>
</html>
