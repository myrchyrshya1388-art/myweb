<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styl.css">
  <title>کیبوردذ گیمینگ</title>
  <link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="product-detail">

  <!-- تصویر -->
  <div class="product-image">
    <img id="mainImage" src="/images/kebord.jpg">
  </div>

  <!-- اطلاعات -->
  <div class="product-content">
    <h1>کیبورد گیمینگ</h1>

    <p class="product-price">450,000 تومان</p>
    
    <div class="product-meta">

  <!-- موجودی -->
  <div class="stock">
    موجودی:
    <span id="stockCount">5</span> عدد
  </div>

  <!-- رنگ‌ها -->


</div>

    <div class="product-actions">
      <button class="add-btn"
        onclick="addToCart('Xbox Series X', 45000000)">
        افزودن به سبد خرید
      </button>

      <button class="wishlist-btn"
        onclick="toggleWishlist(this)">
        ❤️
      </button>
    </div>

    <div class="product-desc">
      <h3>توضیحات محصول</h3>
      <p>
        کنسول Xbox Series X با پردازنده قدرتمند، اجرای بازی‌ها با کیفیت 4K
        و حافظه SSD پرسرعت، تجربه‌ای بی‌نظیر از گیمینگ را فراهم می‌کند.
      </p>
    </div>

    <div class="product-specs">
      <h3>مشخصات فنی</h3>
      <ul>
        <li>دکمه نرم</li>
        <li>رزولوشن: 4K</li>
        <li>پردازنده: AMD Zen 2</li>
        <li>پشتیبانی HDR</li>
      </ul>
    </div>
  </div>

</div>

<script src="cart.js"></script>
</body>
</html>
